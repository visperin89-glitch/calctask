name: Build & Sign Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Web
        run: |
          npm ci
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate Keystore & Sign APK on the fly
        run: |
          keytool -genkey -v -keystore auto-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias taxbook -storepass 123456 -keypass 123456 -dname "CN=TaxBook, OU=App, O=Self, L=Odesa, C=UA"
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore auto-release.jks -storepass 123456 -keypass 123456 $APK_PATH taxbook
          mkdir -p output
          cp $APK_PATH output/TaxBook-Signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxBook-Release-Signed
          path: output/TaxBook-Signed.apk
          retention-days: 14
